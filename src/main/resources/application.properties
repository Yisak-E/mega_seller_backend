# ===== Mega Seller Cinema Ticket System =====
spring.application.name=megaseller-cinema

# --- PostgreSQL (for production on Render) ---
# These properties are designed to be overridden by environment variables on Render.
# Render will provide a DATABASE_URL which Spring Boot can use.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/megasellerdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

# --- H2 In-Memory DB (for local dev, commented out) ---
# spring.datasource.url=jdbc:h2:mem:megasellerdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
