# ===== Mega Seller Cinema Ticket System =====
spring.application.name=megaseller-cinema

# --- PostgreSQL (Environment Variables with Hardcoded Fallbacks) ---
# If SPRING_DATASOURCE_URL is set in the environment (e.g., on Render), it will be used.
# If not, it will fall back to the hardcoded URL provided after the colon.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://dpg-d8g8ljrtqb8s73bbb5sg-a:5432/megaseller_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:megaseller_db_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:PVVXvtwiAcPxGcwWZTa00Zvh1Q9a1fOz}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

# --- JWT ---
megaseller.jwt.secret=${JWT_SECRET:MegaSellerSuperSecretKeyForJWTSigningMustBe256BitsLongAtMinimum2024}
megaseller.jwt.expiration=${JWT_EXPIRATION:86400000}

# --- Server ---
server.port=${PORT:8080}

# --- CORS ---
megaseller.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://megaseller-front.onrender.com,*}

# --- Concurrency ---
megaseller.ticket.lock-timeout-ms=2000
megaseller.sse.push-interval-ms=200

# --- Logging ---
logging.level.com.megaseller=INFO
logging.level.org.springframework.security=WARN
