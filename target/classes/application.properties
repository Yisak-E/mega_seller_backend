# ===== Mega Seller Cinema Ticket System =====
# Default profile uses H2 (in-memory) for easy local dev

spring.application.name=megaseller-cinema

# --- H2 In-Memory DB (default / dev) ---
spring.datasource.url=jdbc:h2:mem:megasellerdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

# --- JWT ---
megaseller.jwt.secret=MegaSellerSuperSecretKeyForJWTSigningMustBe256BitsLongAtMinimum2024
megaseller.jwt.expiration=86400000

# --- Server ---
server.port=8080

# --- CORS ---
megaseller.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# --- Concurrency ---
megaseller.ticket.lock-timeout-ms=2000
megaseller.sse.push-interval-ms=200

# --- Logging ---
logging.level.com.megaseller=INFO
logging.level.org.springframework.security=WARN
